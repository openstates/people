name: Lint YAML

on:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "settings.yml"
      - ".yamllint"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/lint-yaml.yml"
      - ".github/scripts/check_duplicate_people.py"
      - ".github/scripts/check_role_dates.py"
  pull_request:
    branches:
      - main
    paths:
      - "data/**"
      - "settings.yml"
      - ".yamllint"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/lint-yaml.yml"
      - ".github/scripts/check_duplicate_people.py"
      - ".github/scripts/check_role_dates.py"

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      # Python & dependency installation
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
      id: changed-dirs
      with:
        files: data/**
        dir_names: 'true'
    - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
      id: changed-files
    - name: install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        enable-cache: true
    - name: Yaml file linting
      run: uvx yamllint==1.38.0 -s .
    - name: install dependencies
      run: uv sync

#    - name: lint people
#      run: uv run os-people lint
#      env:
#        OS_PEOPLE_DIRECTORY: ${{ env.GITHUB_WORKSPACE }}
    - name: lint people selectively
      env:
        ALL_CHANGED_DIRS: ${{ steps.changed-dirs.outputs.all_changed_files }}
        OS_PEOPLE_DIRECTORY: ${{ env.GITHUB_WORKSPACE }}
      run: |
        for dir in ${ALL_CHANGED_DIRS}; do
          if [[ "$dir" =~ ^data/(ak|al|ar|az|ca|co|ct|dc|de|fl|ga|hi|ia|id|il|in|ks|ky|la|ma|md|me|mi|mn|mo|ms|mt|nc|nd|ne|nh|nj|nm|nv|ny|oh|ok|or|pa|pr|ri|sc|sd|tn|tx|us|ut|va|vt|wa|wi|wv|wy)/(legislature|retired|executive|municipalities) ]]; then
            dir=${BASH_REMATCH[1]}
            uv run os-people lint "$dir"
          else
            echo "$dir contains changes, but ignored for linting people"
          fi
        done
    - name: check duplicate people selectively
      env:
        ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
      run: |
        uv run python .github/scripts/check_duplicate_people.py --changed-files ${ALL_CHANGED_FILES}
    - name: check role date integrity selectively
      env:
        ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
      run: |
        uv run python .github/scripts/check_role_dates.py --changed-files ${ALL_CHANGED_FILES}
    - name: lint committees selectively
      env:
        OS_PEOPLE_DIRECTORY: ${{ env.GITHUB_WORKSPACE }}
        ALL_CHANGED_DIRS: ${{ steps.changed-dirs.outputs.all_changed_files }}
      run: |
        abbrs=()
        for dir in ${ALL_CHANGED_DIRS}; do
          if [[ "$dir" =~ ^data/([a-z]{2})/committees ]]; then
            abbrs+=("${BASH_REMATCH[1]}")
          fi
        done
        if [[ ${#abbrs[@]} -gt 0 ]]; then
          mapfile -t abbrs < <(printf '%s\n' "${abbrs[@]}" | sort -u)
          uv run os-committees lint "${abbrs[@]}"
        fi
