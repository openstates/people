name: Update Database

on:
  push:
    branches:
      - main

# Run uploads one at a time, in push order, so an older commit's upload can't
# finish after (and overwrite) a newer one's.
concurrency:
  group: update-database
  cancel-in-progress: false

jobs:
  update-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    # Python & dependency installation
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        enable-cache: true
    - name: install dependencies
      run: uv sync

    # Gates the upload: PyYAML keeps the last value of a duplicated key without
    # error, so yamllint's key-duplicates rule is the only guard against
    # silently uploading lost data, and main has no branch protection.
    - name: Yaml file linting
      run: |
        git ls-files -z '*.yml' '*.yaml' .yamllint \
          | xargs -0 -n 2000 -P "$(nproc)" uv run yamllint -s

    - name: people to S3
      run: uv run os-people to-csv --upload
      env:
        OS_PEOPLE_DIRECTORY: ${{ env.GITHUB_WORKSPACE }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
