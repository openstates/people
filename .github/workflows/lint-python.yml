name: Lint Python

on:
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/lint-python.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.py"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/lint-python.yml"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: install uv
      uses: astral-sh/setup-uv@v3
      with:
        python-version: 3.11
        enable-cache: true

    - name: install dependencies
      run: uv sync

    - name: ruff check
      run: uv run ruff check .

    - name: ruff format check
      run: uv run ruff format --check .

    - name: ty check
      run: uv run ty check .
