# Legal term-start rules, one entry per jurisdiction (directory under data/).
#
# This table is the source of truth for term dates. check_terms.py computes the expected
# date from it, so a review only researches a rule when the entry is missing, unverified,
# stale (verified more than 2 years ago), or contradicted by a source.
# A role's end_date is the next term's start (split-term rule), so `start` covers both.
#
# legislature:            applies to upper, lower and unicameral (`legislature`) roles
#   start:  rule (grammar below)          REQUIRED
#   upper:/lower: {start: ...}            only when a chamber differs
#   term:   {upper: N, lower: N}          years
#   vacancy: how a mid-term member's start date is set (oath, certification, ...)
#   repo:   rule the repo actually uses, only when it differs from `start`
#   cite:   constitution/statute section  REQUIRED to count as verified
#   url:    official text of `cite`        REQUIRED to count as verified
#   verified: YYYY-MM-DD                   date someone read `url` and confirmed `start`
#   notes:  anything a reviewer must know
# executive:              governor and other elected statewide offices
#   same fields, plus
#   appointed: [role types that are appointed, not elected, in this state]
#   offices: {<role type>: {start: ..., term: N, cite: ...}}   only when an office differs
#   previous: [{start: <old rule>, until: YYYY-MM-DD, cite: ...}]  rules replaced by a law
#             change; `until` is the first day the current rule applies
#
# Rule grammar (case-insensitive; check_terms.py --self-test parses every rule here):
#   election                       general election day (Tue after 1st Mon of Nov)
#   day after election
#   <N> days after election        e.g. "15 days after election"
#   <Nth> <Dow> of <Mon>           e.g. "2nd Mon of Jan"
#   <Mon> <D>                      e.g. "Jan 3"
#   <Dow> after <anchor>           first such weekday strictly after the anchor,
#                                  e.g. "Wed after 1st Mon of Jan", "Mon after Jan 1"
#   oath | certification | varies  no fixed date: verify per person
#   [YYYY-MM-DD, ...]              explicit dates, when the law ties the start to an event
#                                  such as the session convening; dates outside the list are
#                                  reported off-cycle, so add each new session's date
# A Jan-Oct date belongs to the year after the election; Nov/Dec to the election year.
# Role types in use: upper, lower, legislature, governor, lt_governor, attorney general,
# secretary of state, chief election officer, treasurer, auditor.

ak:
  legislature:
    start: 3rd Tue of Jan
    term: {upper: 4, lower: 2}
    vacancy: >-
      governor appoints within 30 days (AS 15.40.320); the term begins when same-party members
      of the house confirm, or if no confirmation is required, the first day the appointee is
      present when the legislature meets (AS 15.40.340).
    cite: AS 24.05.080
    url: https://www.akleg.gov/basis/statutes.asp#24.05.080
    verified: 2026-10-07
    notes: >-
      Const. art. II sec. 3 sets the 4th Mon of Jan "unless otherwise provided by law"; AS 24.05.080
      sets the 3rd Tue of Jan. Repo matches 2015-2025 except 2021-01-11 (law: 2021-01-19) and
      2013-01-28 (law: 2013-01-15).
  executive:
    start: 1st Mon of Dec
    term: 4
    appointed: [attorney general]
    vacancy: lt governor succeeds the governor; the AG serves at the governor's pleasure (start = appointment).
    cite: Alaska Const. art. III secs. 4, 8, 25
    url: https://ltgov.alaska.gov/information/alaskas-constitution/
    verified: 2026-10-07
    notes: Governor and lt governor from noon on the 1st Mon of Dec. No elected SoS. Repo matches.
al:
  legislature:
    start: day after election
    term: {upper: 4, lower: 4}
    vacancy: >-
      governor issues a writ of special election; an unopposed candidate is certified without an
      election (sec. 46(b)); a seat vacated on or after Oct 1 of the 3rd year stays empty (sec. 46(c)).
      Start = certification or oath.
    cite: Ala. Const. 2022 sec. 46
    url: https://www.legislature.state.al.us/pdf/lsa/proposed-constitution/2022-constitution-statewide.pdf
    verified: 2026-10-07
    notes: Repo matches. The url path says "proposed" but it is the text ratified in Nov 2022.
  executive:
    start: Mon after 2nd Tue of Jan
    term: 4
    vacancy: lt governor succeeds the governor; governor appoints AG, auditor, SoS, treasurer, agriculture commissioner until a successor qualifies (sec. 136).
    cite: Ala. Const. 2022 sec. 116
    url: https://www.legislature.state.al.us/pdf/lsa/proposed-constitution/2022-constitution-statewide.pdf
    verified: 2026-10-07
    notes: Repo matches.
ar:
  legislature:
    start: varies
    repo: 2nd Mon of Jan
    term: {upper: 4, lower: 2}
    vacancy: governor issues writs of special election (Ark. Const. art. 5 sec. 6); start = certification or oath.
    notes: >-
      No fixed date found: art. 5 secs. 2-3 set term lengths and sec. 5(b) the session (2nd Mon of
      Jan, odd years); Ark. Code 21-1-102 (unofficial 2012 mirror) excepts legislators from its Jan 1
      rule. Repo uses the convening date.
  executive:
    start: varies
    repo: 2nd Tue of Jan
    term: 4
    vacancy: governor appoints SoS, treasurer, auditor, AG for the unexpired term (art. 6 sec. 22); start = appointment.
    notes: >-
      Art. 6 sec. 3: the Speaker opens and publishes the votes "during the first week of the session",
      and installation follows; by custom the 2nd Tue of Jan. Source: SoS "Election Laws of Arkansas and
      Constitution, 2025 Edition". Cole Jester's 2025-01-01 start is an appointment.
az:
  legislature:
    start: varies
    repo: 2nd Mon of Jan
    term: {upper: 2, lower: 2}
    vacancy: county board of supervisors appoints from 3 same-party nominees (A.R.S. 41-1202); start = appointment/oath.
    notes: >-
      No explicit term start found (art. 4 pt. 2 sec. 21 implies the 1st Mon of Jan without stating it).
      A.R.S. 41-1101 convenes the legislature at noon on the 2nd Mon of Jan, when members take the oath;
      the repo uses that date.
  executive:
    start: 1st Mon of Jan
    term: 4
    vacancy: succession order lt gov, SoS, AG, treasurer, superintendent (art. 5 sec. 6); other vacancies by governor appointment (art. 5 sec. 8).
    cite: Ariz. Const. art. 5 sec. 1
    url: https://www.azleg.gov/const/5/1.htm
    verified: 2026-10-07
    notes: The lt governor office (Prop 131, 2022) is first elected in 2026. Repo matches.
ca:
  legislature:
    start: 1st Mon of Dec
    term: {upper: 4, lower: 2}
    vacancy: special election called by the Governor; start = oath after certification (verify per person)
    notes: >-
      Cal. Const. art. IV sec. 2(a)(3): terms "commence on the first Monday in December next
      following her or his election". Repo matches. Not verified: leginfo.legislature.ca.gov
      returns 403 to automated fetches; wording from secondary sources.
  executive:
    start: Mon after Jan 1
    term: 4
    vacancy: Governor nominates and the Legislature confirms (Cal. Const. art. V sec. 5(b)); start = confirmation/oath
    notes: >-
      Cal. Const. art. V secs. 2, 11: Governor, Lt Gov, AG, Controller, SoS, Treasurer hold office
      "from the Monday after January 1 following the election". Repo matches. Not verified: leginfo 403.
co:
  legislature:
    start: [2019-01-04, 2021-01-13, 2023-01-09, 2025-01-08]
    term: {upper: 4, lower: 2}
    vacancy: party vacancy committee selects; start = selection/oath (verify per person)
    cite: Colo. Const. art. V, sec. 7
    url: https://www.coloradosos.gov/pubs/elections/Initiatives/titleBoard/filings/2023-2024/286Amended.pdf
    notes: >-
      Terms begin "on the convening of the first regular session of the general assembly next after
      their election" (no later than the 2nd Wed of Jan), so the date varies by session; add each
      new session's convening date to the list. Repo uses these dates. The url is an SOS filing
      quoting the section; the official constitution (LexisNexis) was not fetched, so unverified.
  executive:
    start: 2nd Tue of Jan
    term: 4
    vacancy: Lt Gov by Governor nomination confirmed by both houses (art. IV sec. 13); others by Governor appointment
    notes: >-
      Colo. Const. art. IV sec. 1 and C.R.S. 1-1-201: 4-year terms "commencing on the second Tuesday
      of January". Repo matches. Not verified: official text on LexisNexis, not fetched.
ct:
  legislature:
    start: Wed after 1st Mon of Jan
    term: {upper: 2, lower: 2}
    vacancy: special election by writ (C.G.S. 9-212 ff.); start = oath after the canvass (verify per person)
    cite: Conn. Const. art. III, sec. 10
    url: https://portal.ct.gov/sots/register-manual/section-i/constitution-of-the-state-of-connecticut
    verified: 2026-10-07
    notes: Repo matches.
  executive:
    start: Wed after 1st Mon of Jan
    term: 4
    cite: Conn. Const. art. IV, sec. 2
    url: https://portal.ct.gov/sots/register-manual/section-i/constitution-of-the-state-of-connecticut
    verified: 2026-10-07
    notes: Governor, Lt Gov, Secretary of the State, Treasurer, Comptroller, AG. Repo matches.
dc:
  legislature:
    start: Jan 2
    term: {legislature: 4}
    vacancy: >-
      ward seat: special election; winner takes office on the day the Board certifies the election.
      At-large seat: party central committee appoints an interim member (start = appointment date)
      until the special-election winner is certified.
    cite: D.C. Code sec. 1-204.01
    url: https://code.dccouncil.gov/us/dc/council/code/sections/1-204.01
    verified: 2026-10-07
    notes: Staggered 4-year terms "begin at noon on January 2nd of the year following their election". Repo matches.
  executive:
    start: Jan 2
    term: 4
    vacancy: special election for the remainder of the term; start = certification/oath (verify per person)
    cite: D.C. Code sec. 1-204.21
    url: https://code.dccouncil.gov/us/dc/council/code/sections/1-204.21
    verified: 2026-10-07
    notes: Mayor (role type governor). Repo matches.
de:
  legislature:
    start: day after election
    term: {upper: 4, lower: 2}
    vacancy: special election by writ of the presiding officer (Governor if not in session); start = day after the special election.
    cite: Del. Const. art. II, secs. 3(e), 6
    url: https://delcode.delaware.gov/constitution/constitution-03.html
    verified: 2026-10-07
    notes: >-
      "The terms of Senators and Representatives begin on the day next after their election."
      Repo matches since 2018. 2011-2015 roles use the 2nd Tue of Jan, which may follow the
      pre-amendment text (83 Del. Laws c. 351 / 84 Del. Laws c. 18): add it under `previous:`
      once read; don't "fix" pre-2018 roles before then.
  executive:
    start: 3rd Tue of Jan
    term: 4
    appointed: [chief election officer]
    offices:
      attorney general:
        start: 1st Tue of Jan
        cite: Del. Const. art. III, secs. 21, 24
    cite: Del. Const. art. III, secs. 5, 19, 21, 24
    url: https://delcode.delaware.gov/constitution/constitution-04.html
    verified: 2026-10-07
    notes: >-
      Governor "4 years from the third Tuesday in January next ensuing"; lt gov same term. AG,
      treasurer, auditor, insurance commissioner default to the 1st Tue of Jan (sec. 24). The State
      Election Commissioner (chief election officer) is appointed for 4 years with Senate
      confirmation (15 Del. C. 301(a)); the roster gives the current term ending 2028-06-30, so
      terms do not run 4 years from the 2019-06-19 confirmation: each split needs a reappointment
      or confirmation record.
fl:
  legislature:
    start: election
    term: {upper: 4, lower: 2}
    vacancy: filled only by special election; members take office upon election, so start = special election day.
    cite: Fla. Const. art. III, sec. 15(d)
    url: https://www.flsenate.gov/Laws/Constitution
    verified: 2026-10-07
    notes: Repo matches. Senate terms can be 2 years after redistricting (art. III, sec. 15(a)).
  executive:
    start: Tue after 1st Mon of Jan
    term: 4
    appointed: [secretary of state]
    vacancy: >-
      Governor appoints (art. IV, sec. 1(f)): for the rest of the term if under 28 months remain,
      otherwise until the Tue after the 1st Mon of Jan following the next general election.
      Start = appointment date.
    cite: Fla. Const. art. IV, secs. 5(a), 1(f)
    url: https://www.flsenate.gov/Laws/Constitution
    verified: 2026-10-07
    notes: Governor, lt gov, AG, CFO, agriculture commissioner. SoS serves at the Governor's pleasure (Fla. Stat. 20.10). Repo matches.
ga:
  legislature:
    start: 2nd Mon of Jan
    term: {upper: 2, lower: 2}
    vacancy: special election; start = special election date or oath (verify per person).
    notes: >-
      Art. III, sec. II, para. V(a): members serve "until the time fixed for the convening of the
      next General Assembly", which convenes the 2nd Mon of Jan (art. III, sec. IV, para. I). Repo
      matches. Unverified: read on FindLaw only; sos.ga.gov's PDF returned 403.
  executive:
    start: oath
    term: 4
    vacancy: >-
      Lt Gov succeeds the Governor; the Governor appoints to other constitutional offices until a
      successor is elected. Start = appointment/oath date.
    notes: >-
      No fixed date: the Governor-elect is "installed in office at the next session of the General
      Assembly" (art. V, sec. I, para. II); other officers serve the Governor's term. Inauguration
      varies (2019-01-14, 2023-01-12). Lt Gov Burt Jones's 2023-01-09 needs a swearing-in source.
      Unverified: FindLaw only.
hi:
  legislature:
    start: election
    term: {upper: 4, lower: 2}
    vacancy: Governor appoints from a party list (art. III, sec. 5; HRS 17-3, not fetched); start = appointment date.
    cite: Haw. Const. art. III, secs. 4, 5
    url: https://lrb.hawaii.gov/constitution/
    verified: 2026-10-07
    notes: >-
      "The term of a member of the legislature shall begin on the day of the general election at
      which elected". Repo matches. Senate terms can be 2 years after reapportionment (art. III, sec. 7).
  executive:
    start: 1st Mon of Dec
    term: 4
    appointed: [attorney general, chief election officer]
    cite: Haw. Const. art. V, secs. 1, 2
    url: https://lrb.hawaii.gov/constitution/
    verified: 2026-10-07
    notes: Governor and lt gov. AG appointed with Senate consent; chief election officer appointed by the Elections Commission. Repo matches.
ia:
  legislature:
    start: Jan 2
    repo: Jan 1
    term: {upper: 4, lower: 2}
    vacancy: special election; a vacancy-filler's term "shall commence as soon as the officer has qualified" (Iowa Code 39.8).
    cite: Iowa Code 39.8
    url: https://www.legis.iowa.gov/docs/code/39.8.pdf
    verified: 2026-10-07
    notes: >-
      Terms begin "on the first day of January following the election which is not a Sunday or legal
      holiday"; Jan 1 is always a legal holiday (Iowa Code 1C.1), so Jan 2, or Jan 3 when Jan 2 is a
      Sunday (next: 2033, which this rule gets wrong). Repo mixed: 2023-01-01 x80, 2023-01-03 x35,
      2025-01-01 x16, 2025-01-02 x7.
  executive:
    start: Tue after 2nd Mon of Jan
    term: 4
    offices:
      attorney general: {start: Jan 2, cite: "Iowa Code 39.8, 39.9"}
      secretary of state: {start: Jan 2, cite: "Iowa Code 39.8, 39.9"}
    vacancy: lt governor succeeds the governor; other vacancies by governor appointment, starting when qualified (39.8).
    cite: Iowa Const. art. IV, sec. 15; Iowa Code 39.8, 39.9
    url: https://www.legis.iowa.gov/docs/publications/ICNST/402724.pdf
    verified: 2026-10-07
    notes: Governor and lt governor "commence on the Tuesday after the second Monday of January"; others use 39.8 (Jan 2).
id:
  legislature:
    start: Dec 1
    term: {upper: 2, lower: 2}
    vacancy: governor appoints from the district party committee's nominees (statute not fetched); start = appointment/oath.
    cite: Idaho Const. art. III, sec. 3
    url: https://legislature.idaho.gov/statutesrules/idconst/ArtIII/Sect3
    verified: 2026-10-07
    notes: Repo matches; older outliers use 2013-01-01 and 2011-01-01.
  executive:
    start: 1st Mon of Jan
    term: 4
    vacancy: governor appoints (art. IV sec. 6, not fetched); start = appointment/oath.
    cite: Idaho Const. art. IV, sec. 1
    url: https://legislature.idaho.gov/statutesrules/idconst/ArtIV/Sect1
    verified: 2026-10-07
    notes: Governor, LG, SoS, controller, treasurer, AG, superintendent. Repo matches.
il:
  legislature:
    start: 2nd Wed of Jan
    term: {upper: 4-4-2 cycle per decade, lower: 2}
    vacancy: same-party appointment within 30 days (Const. art. IV sec. 2(d)); start = appointment date.
    notes: >-
      No explicit term-start clause; art. IV sec. 5(a) has the General Assembly convene the 2nd Wed of
      Jan and be "a continuous body during the term", implying the term starts at convening. Repo
      matches. Unverified: no statute found.
  executive:
    start: 2nd Mon of Jan
    term: 4
    appointed: [chief election officer]
    vacancy: AG/SoS/comptroller/treasurer by governor appointment (art. V sec. 7); an LG vacancy stays vacant.
    cite: Ill. Const. art. V, sec. 2
    url: https://lrb.ilga.gov/Commission/lrb/con5.htm
    verified: 2026-10-07
    notes: Pritzker end 2027-01-04 should be 2027-01-11; Raoul start 2019-01-15 should be 2019-01-14.
in:
  legislature:
    start: day after election
    term: {upper: 4, lower: 2}
    vacancy: party caucus selection (IC 3-13-5, not fetched); start = selection/oath.
    cite: Ind. Const. art. 4, sec. 3
    url: https://web.archive.org/web/2014/http://www.in.gov/legislative/ic/code/const/art4.html
    notes: 'Repo matches. Unverified: archived copy only (iga.in.gov is JS-only).'
  executive:
    start: 2nd Mon of Jan
    term: 4
    offices:
      secretary of state: {start: Jan 1, cite: IC 4-5-1-1}
    vacancy: governor appoints SoS/AG; an LG vacancy is filled by governor nomination confirmed by the General Assembly.
    cite: Ind. Const. art. 5, sec. 9; IC 4-6-1-2 (AG)
    url: https://web.archive.org/web/2013/http://www.in.gov/legislative/ic/code/const/art5.html
    notes: >-
      Governor, LG and AG start the 2nd Mon of Jan; SoS "shall take office on January 1". Unverified:
      archived copies only. Rokita's AG role is not split at 2025-01-13.
ks:
  legislature:
    start: 2nd Mon of Jan
    term: {upper: 4, lower: 2}
    vacancy: governor appoints whoever the district party convention selects (K.S.A. 25-3902, 25-3903); start = appointment/oath.
    cite: Kan. Const. art. 2, sec. 2
    url: https://www.ksrevisor.gov/kanconst/093_002_0002.html
    verified: 2026-10-07
    notes: Repo matches.
  executive:
    start: 2nd Mon of Jan
    term: 4
    vacancy: governor appoints; start = appointment/oath.
    cite: Kan. Const. art. 1, sec. 1
    url: https://www.ksrevisor.gov/kanconst/093_001_0001.html
    verified: 2026-10-07
    notes: Governor, lt governor, SoS, AG. Repo matches.
ky:
  legislature:
    start: Jan 1
    term: {upper: 4, lower: 2}
    vacancy: special election only (Ky. Const. sec. 152); start = certification/oath.
    cite: Ky. Const. sec. 30
    url: https://apps.legislature.ky.gov/Law/Constitution/Constitution/ViewConstitution?rsn=34
    verified: 2026-10-07
    notes: '"shall begin upon the first day of January of the year succeeding their election". Repo matches.'
  executive:
    start: Tue after Dec 6
    term: 4
    offices:
      attorney general: {start: 1st Mon of Jan, cite: Ky. Const. sec. 91}
      secretary of state: {start: 1st Mon of Jan, cite: Ky. Const. sec. 91}
      treasurer: {start: 1st Mon of Jan, cite: Ky. Const. sec. 91}
      auditor: {start: 1st Mon of Jan, cite: Ky. Const. sec. 91}
    vacancy: governor appoints to statewide offices until the next election (sec. 152); lt gov succeeds a governor (sec. 82).
    cite: Ky. Const. secs. 73, 91
    url: https://apps.legislature.ky.gov/Law/Constitution/Constitution/ViewConstitution?rsn=81
    verified: 2026-10-07
    notes: >-
      Governor and lt governor begin "on the fifth Tuesday succeeding their election" (sec. 73):
      election day + 35 days, always the Tuesday between Dec 7 and 13. Odd-year elections. Sec. 91
      officers start the first Monday in January after their election (rsn=99).
la:
  legislature:
    start: 2nd Mon of Jan
    term: {upper: 4, lower: 4}
    vacancy: special election only (art. III sec. 4(D)); winner takes office within 30 days of promulgation (art. III sec. 5(B)); start = oath.
    cite: La. Const. art. III, sec. 5(A); art. IV, sec. 3(A)
    url: https://legis.la.gov/Legis/Law.aspx?d=206420
    verified: 2026-10-07
    notes: Members take office with the statewide officials, noon on the 2nd Mon of Jan. Repo matches.
  executive:
    start: 2nd Mon of Jan
    term: 4
    vacancy: special election or succession per art. IV; start = oath.
    cite: La. Const. art. IV, sec. 3(A)
    url: https://legis.la.gov/Legis/Law.aspx?d=206439
    verified: 2026-10-07
    notes: All elected statewide officers. 2026 bills on election timing were pending, none in force at verification.
ma:
  legislature:
    start: 1st Wed of Jan
    term: {upper: 2, lower: 2}
    vacancy: special election; no start date in the constitution, use the oath date.
    cite: Mass. Const. Amend. art. LXXXII (art. LXIV sec. 1)
    url: https://malegislature.gov/Laws/Constitution
    verified: 2026-10-07
    notes: Repo mostly matches; ~16 roles use 2011-01-01 and some 2013-01-01 (placeholders).
  executive:
    start: Thu after 1st Wed of Jan
    term: 4
    offices:
      attorney general: {start: 3rd Wed of Jan}
      chief election officer: {start: 3rd Wed of Jan}
      treasurer: {start: 3rd Wed of Jan}
      auditor: {start: 3rd Wed of Jan}
    vacancy: governor appoints with the council or the legislature elects, depending on office (not researched); start = appointment/oath.
    cite: Mass. Const. Amend. art. LXXXII (art. LXIV sec. 1)
    url: https://malegislature.gov/Laws/Constitution
    verified: 2026-10-07
    notes: Governor and lt governor begin noon on the Thursday after the 1st Wed of Jan; secretary (chief election officer), treasurer, AG, auditor on the 3rd Wed of Jan. All elected.
md:
  legislature:
    start: 2nd Wed of Jan
    term: {upper: 4, lower: 4}
    vacancy: Governor appoints the party central committee's nominee (Const. Art. III s13); start = appointment/oath.
    cite: Md. Const. Art. III, s6
    url: https://msa.maryland.gov/msa/mdmanual/43const/html/03art3.html
    verified: 2026-10-07
    notes: Repo matches.
  executive:
    start: 3rd Wed of Jan
    term: 4
    appointed: [chief election officer]
    offices:
      attorney general:
        start: oath
        cite: Md. Const. Art. V, s1
        url: https://msa.maryland.gov/msa/mdmanual/43const/html/05art5.html
        notes: '"four years from the time of his election and qualification"; repo 2023-01-03 is the oath.'
    cite: Md. Const. Art. II, s1
    url: https://msa.maryland.gov/msa/mdmanual/43const/html/02art2.html
    verified: 2026-10-07
    notes: Lt governor assumed to share the governor's start (Art. II s1A gives none). Repo matches.
me:
  legislature:
    start: Tue after Nov 29
    repo: 1st Wed of Dec
    term: {upper: 2, lower: 2}
    vacancy: special election (Const. Art. IV Pt.1 s6); start = oath after certification.
    cite: Me. Const. Art. IV, Pt.1 s2; Pt.2 s1; Pt.3 s1
    url: https://legislature.maine.gov/ros/LawsOfMaine/App/views/constitution.html
    verified: 2026-10-07
    notes: >-
      AMBIGUOUS: members "hold their office 2 years from the day next preceding the first Wednesday
      in December" - either that Tuesday or (reading "from" as exclusive) the Wednesday, when the
      Legislature convenes. Repo uses the Wednesday for 2018-2022 and the Tuesday for 2024. Pick
      one reading and record it here.
  executive:
    start: Wed after 1st Tue of Jan
    term: 4
    offices:
      attorney general: {start: oath, term: 2}
      secretary of state: {start: oath, term: 2}
      treasurer: {start: oath, term: 2}
    cite: Me. Const. Art. V, Pt.1 s2
    url: https://legislature.maine.gov/ros/LawsOfMaine/App/views/constitution.html
    verified: 2026-10-07
    notes: >-
