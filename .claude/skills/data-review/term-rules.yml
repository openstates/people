      unexpired term takes office on receiving the certificate of election (Gov't Code 601.004).
    cite: Tex. Const. art. IV, secs. 4, 16(a)
    url: https://tcss.legis.texas.gov/resources/CN/htm/CN.4.htm
    verified: 2026-10-07
    notes: >-
      Governor installed "on the first Tuesday after the organization of the Legislature"; LG serves
      the same term. SoS is appointed and serves during the governor's term.
us:
  legislature:
    start: Jan 3
    term: {upper: 6, lower: 2}
    vacancy: >-
      House: 'special election (art. I, sec. 2, cl. 4). Senate: governor''s temporary appointment'
      where state law allows, or special election (amend. XVII). Start = oath date.
    cite: U.S. Const. amend. XX, sec. 1
    url: https://www.archives.gov/founding-docs/amendments-11-27
    verified: 2026-10-07
    notes: >-
      Repo uses Jan 3 for 2013 and 2017-2025, but the convening date for some older Congresses
      (2015-01-06, 2011-01-05, 2009-01-06, ...). The legal start is Jan 3.
ut:
  legislature:
    start: Jan 1
    term: {upper: 4, lower: 2}
    vacancy: governor appoints from the party's nominees (Const. art. VI, sec. 13, not fetched); start = appointment/oath.
    cite: Utah Const. art. VI, secs. 3(2), 4(2)
    url: https://le.utah.gov/xcode/ArticleVI/UC_AVI_S3_1800010118000101.html
    verified: 2026-10-07
    notes: Repo matches.
  executive:
    start: 1st Mon of Jan
    term: 4
    vacancy: governor appoints for auditor, treasurer, AG from the same party (art. VII, sec. 10(2)); start = appointment/oath.
    cite: Utah Const. art. VII, sec. 1(2)(a)
    url: https://le.utah.gov/xcode/ArticleVII/UC_AVII_S1_1800010118000101.html
    verified: 2026-10-07
    notes: Governor, LG, auditor, treasurer, AG. Derek Brown's AG start 2025-01-07 vs legal 2025-01-06.
va:
  legislature:
    start: 2nd Wed of Jan
    term: {upper: 4, lower: 2}
    vacancy: special election by writ (Va. Code 24.2-216); start = qualification/oath after certification.
    cite: Va. Code 24.2-214, 24.2-215
    url: https://law.lis.virginia.gov/vacodefull/title24.2/chapter2/article4/
    verified: 2026-10-07
    notes: Odd-year elections. Repo matches.
  executive:
    start: Sat after 2nd Wed of Jan
    term: 4
    appointed: [chief election officer]
    vacancy: >-
      LG succeeds the governor (24.2-211); LG vacancy not filled (24.2-212); AG elected by the General
      Assembly or interim appointment (24.2-213).
    cite: Va. Const. art. V, sec. 1; Va. Code 24.2-210
    url: https://law.lis.virginia.gov/vacodefull/title24.2/chapter2/article3/
    verified: 2026-10-07
    notes: >-
      Commissioner of Elections (chief election officer) is appointed with General Assembly
      confirmation for 4 years beginning July 1 of the year after a gubernatorial election
      (Va. Code 24.2-102(B)).
vt:
  legislature:
    start: Wed after 1st Mon of Jan
    term: {upper: 2, lower: 2}
    vacancy: Governor appoints for the unexpired term (17 V.S.A. 2622-2623, not fetched); start = appointment/oath.
    cite: Vt. Const. ch. II sec. 46
    url: https://legislature.vermont.gov/statutes/constitution-of-the-state-of-vermont/
    verified: 2026-10-07
    notes: Repo matches.
  executive:
    start: oath
    repo: Thu after 1st Mon of Jan
    term: 2
    vacancy: Governor appoints the Treasurer "for the time being" (ch. II sec. 24); others by statute (17 V.S.A. 2623, not fetched).
    cite: Vt. Const. ch. II sec. 49
    url: https://legislature.vermont.gov/statutes/constitution-of-the-state-of-vermont/
    verified: 2026-10-07
    notes: >-
      Terms "commence when they shall be chosen and qualified" (no fixed date); inauguration follows
      the canvass, which the repo records as the Thursday after the 1st Mon of Jan.
wa:
  legislature:
    start: 2nd Mon of Jan
    term: {upper: 4, lower: 2}
    vacancy: county legislative authority appoints one of 3 same-party nominees (Const. art. II sec. 15); successor elected at the next general election starts when qualified (RCW 42.12.040, 29A.04.133).
    cite: RCW 44.04.021
    url: https://app.leg.wa.gov/RCW/default.aspx?cite=44.04.021
    verified: 2026-10-07
    notes: Repo matches.
  executive:
    start: Wed after 2nd Mon of Jan
    repo: 2nd Mon of Jan
    term: 4
    vacancy: governor appoints until a successor is elected at the next general election (RCW 42.12.040).
    cite: RCW 43.01.010
    url: https://app.leg.wa.gov/RCW/default.aspx?cite=43.01.010
    verified: 2026-10-07
    notes: >-
      Const. art. III sec. 4 says 2nd Mon of Jan "until otherwise provided by law"; RCW 43.01.010 sets
      the Wednesday after. Repo is inconsistent, mostly the 2nd Mon; Ferguson's 2025-01-09 start /
      2028-12-30 end and Hobbs's 2029-01-01 end match neither.
wi:
  legislature:
    start: varies
    repo: 1st Mon of Jan
    term: {upper: 4, lower: 2}
    vacancy: special election called by the governor (Wis. Stat. 8.50); start = oath after certification.
    cite: Wis. Stat. 13.02(1)
    url: https://docs.legis.wisconsin.gov/statutes/statutes/13/i/02
    verified: 2026-10-07
    notes: >-
      GRAMMAR GAP: convenes and takes the oath "on the first Monday of January in each odd-numbered
      year ... but if the first Monday of January falls on January 1 or 2, ... on January 3". Repo
      2023-01-03 follows the exception; 2017-01-02 does not (statute gives 2017-01-03).
  executive:
    start: 1st Mon of Jan
    term: 4
    appointed: [chief election officer]
    cite: Wis. Stat. 8.25(4)(b)2
    url: https://docs.legis.wisconsin.gov/document/statutes/8.25(4)
    verified: 2026-10-07
    notes: >-
      Gov, lt gov, SoS, treasurer, AG. Chief election officer = Elections Commission administrator,
      appointed with Senate consent for 4 years "expiring on July 1 of the odd-numbered year" (15.61).
wv:
  legislature:
    start: Dec 1
    term: {upper: 4, lower: 2}
    vacancy: appointment by general law (governor, from a party list) until a successor elected at the next general election qualifies.
    cite: W. Va. Const. art. IV sec. 7
    url: https://www.wvlegislature.gov/WVCODE/WV_CON.cfm
    verified: 2026-10-07
    notes: Repo matches.
  executive:
    start: Mon after 2nd Wed of Jan
    term: 4
    vacancy: governor appoints SoS/auditor/treasurer/agriculture commissioner/AG until a successor is elected and qualified (art. VII sec. 17).
    cite: W. Va. Const. art. VII sec. 1
    url: https://www.wvlegislature.gov/WVCODE/WV_CON.cfm
    verified: 2026-10-07
    notes: Repo matches.
wy:
  legislature:
    start: 1st Mon of Jan
    term: {upper: 4, lower: 2}
    vacancy: county commissioners appoint until a successor elected at the next general election takes office the 1st Mon of the following January (W.S. 22-18-111).
    cite: W.S. 22-2-107
    url: https://wyoleg.gov/statutes/compress/title22.pdf
    verified: 2026-10-07
    notes: Repo matches except 2013-01-08 (rule gives 2013-01-07).
  executive:
    start: 1st Mon of Jan
    term: 4
    appointed: [attorney general]
    vacancy: temporary appointment until a successor elected at the next general election takes office (W.S. 22-18-111).
    cite: W.S. 22-2-107
    url: https://wyoleg.gov/statutes/compress/title22.pdf
    verified: 2026-10-07
    notes: AG appointed by the governor with Senate consent, serves at pleasure (W.S. 9-1-601). Repo matches.
